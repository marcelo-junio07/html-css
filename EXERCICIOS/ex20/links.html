<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
body{
    font-family: Arial, Helvetica, sans-serif;
}

a{
    color: red;
    text-decoration: none;
    font-weight: bold;
}

a:visited{
    color: darkred;
}

a:hover{
    color: black;
    text-decoration: underline;
}

a:active{
    color: yellow;
}

a::after{
    content: '[link]';
    text-decoration: none;
    font-weight: normal;
    color: darkgray;
}
a::before{
    content: '⇒';
    color: blue;
}

.especial::after{
    content: '⇐';
    color: blue;
    background-color: red 3px;
}

.especial::before{
    background-color: red;
}

.especial::after{
    background-color: red;
}

    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
<li><a href="https://gustavoguanabara.github.io" class="especial" target="_blank">repositorio Github</a></li>
<li><a href="https://youtube.com/cursoemvideo/" target="_blank" class="especial">canal do Youtube</a></li>
<li><a href="https://www.cursoemvideo.com" class="especial" target="_blank">site do cursoemvideo</a></li>


    </ul>


</body>
</html>
