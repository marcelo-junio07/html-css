<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">

<p>
    <label for="iest">Estado:</label>
    <select name="estado" id="iest">

     <optgroup label="Regiao sudoeste">
         <option value="" selected>---Escolha---</option>
         <option value="SP" selected>Sao Paulo</option>
         <option value="RJ">Rio Janeiro</option>
         <option value="MG">Minas Gerais</option>
     </optgroup>

<optgroup label="Regiao Nordeste">
    
    <option value="MA">Maranhao</option>
    <option value="PE">Pernambuco</option>
    <option value="RN">Rio Grande do Norte</option>
</optgroup>
    </select>
</p>

<p>
    <label for="iprof">Profissao</label>
    <input type="text" name="prof" id="iprof" list="lstprof">
    <datalist id="lstprof">
<option>Dentista</option>
<option>professor</option>
<option>Desenvolvedor</option>
<option>Gesseiro</option>
    </datalist>
</p>

<p>
    
    <label for="imsg">Mensagem:</label> <br>
    <textarea name="msg" id="imgs" cols="30" rows="10"></textarea>
</p>

<p>
    <input type="submit" value="Enviar">
<input type="reset" value="Limpar">
</p>



    </form>








</body>
</html>
